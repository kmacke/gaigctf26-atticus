services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      lamort-web:
        condition: service_started
      lamort-coop:
        condition: service_started
      lamort-docrender:
        condition: service_started
      lamort-evaluator:
        condition: service_started
    ports:
      - "3000:8000"
    volumes:
      - ./deploy/nginx/lamort.conf:/etc/nginx/nginx.conf:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lamort
      # SECURITY: rotated off the public repo's "lamort/lamort" default. NOTE: Postgres
      # only applies POSTGRES_USER/POSTGRES_PASSWORD on first init of an empty data
      # volume - an already-initialized "postgres-data" volume will keep the old role
      # and password until it is recreated (or the role is updated manually), so this
      # needs a coordinated redeploy, not just a restart.
      POSTGRES_USER: lamort_app
      POSTGRES_PASSWORD: CZVbAgw2lPF0RaT0sKI5NlkzL5oyB1i6
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamort_app -d lamort"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      # SECURITY: rotated off the well-known "guest/guest" default.
      RABBITMQ_DEFAULT_USER: lamort_mq
      RABBITMQ_DEFAULT_PASS: 2EholF0mxZyz1swHEO0PtoU_qO76x1Gk
    healthcheck:
      # "ping" passes before the AMQP listener accepts connections, and the
      # workers crash if they connect in that window.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      # Each probe boots an Erlang VM, which is slow on a small box.
      timeout: 15s
      start_period: 20s
      retries: 10

  lamort-migrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT_PATH: src/Tools/Lamort.Migrator/Lamort.Migrator.csproj
        APP_DLL: Lamort.Migrator.dll
    environment:
      ConnectionStrings__LamortDb: Host=postgres;Port=5432;Database=lamort;Username=lamort_app;Password=CZVbAgw2lPF0RaT0sKI5NlkzL5oyB1i6
    depends_on:
      postgres:
        condition: service_healthy

  lamort-web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT_PATH: src/Services/Lamort.Web/Lamort.Web.csproj
        APP_DLL: Lamort.Web.dll
    environment:
      ConnectionStrings__LamortDb: Host=postgres;Port=5432;Database=lamort;Username=lamort_app;Password=CZVbAgw2lPF0RaT0sKI5NlkzL5oyB1i6
      Jwt__Issuer: lamort-web
      Jwt__Audience: lamort-internal
      Jwt__SigningKey: nRpw9Q+wTyHR80AzY81FjKrwwB+y+V3MVyfndTDbFmlfA7c8Vub8LGaMkmRnltBk
      Jwt__ExpirationMinutes: 60
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: lamort_mq
      RabbitMq__Password: 2EholF0mxZyz1swHEO0PtoU_qO76x1Gk
      RabbitMq__ExchangeName: lamort.events
      RabbitMq__RoutingKey: mortgage.ready_for_review
    volumes:
      - web-data-protection:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lamort-migrator:
        condition: service_completed_successfully

  lamort-coop:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        PROJECT_PATH: src/Services/Lamort.Coop/Lamort.Coop.csproj
        APP_DLL: Lamort.Coop.dll
    environment:
      ConnectionStrings__LamortDb: Host=postgres;Port=5432;Database=lamort;Username=lamort_app;Password=CZVbAgw2lPF0RaT0sKI5NlkzL5oyB1i6
      Jwt__Issuer: lamort-web
      Jwt__Audience: lamort-internal
      Jwt__SigningKey: nRpw9Q+wTyHR80AzY81FjKrwwB+y+V3MVyfndTDbFmlfA7c8Vub8LGaMkmRnltBk
      Jwt__ExpirationMinutes: 60
    depends_on:
      postgres:
        condition: service_healthy
      lamort-migrator:
        condition: service_completed_successfully

  lamort-docrender:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.docrender
    environment:
      ConnectionStrings__LamortDb: Host=postgres;Port=5432;Database=lamort;Username=lamort_app;Password=CZVbAgw2lPF0RaT0sKI5NlkzL5oyB1i6
      Jwt__Issuer: lamort-web
      Jwt__Audience: lamort-internal
      Jwt__SigningKey: nRpw9Q+wTyHR80AzY81FjKrwwB+y+V3MVyfndTDbFmlfA7c8Vub8LGaMkmRnltBk
      Jwt__ExpirationMinutes: 60
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: lamort_mq
      RabbitMq__Password: 2EholF0mxZyz1swHEO0PtoU_qO76x1Gk
      RabbitMq__ExchangeName: lamort.events
      RabbitMq__QueueName: lamort.docrender.mortgages
      RabbitMq__RoutingKey: mortgage.ready_for_review
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lamort-migrator:
        condition: service_completed_successfully

  lamort-evaluator:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.evaluator
      args:
        PROJECT_PATH: src/Services/Lamort.Evaluator/Lamort.Evaluator.vbproj
        APP_DLL: Lamort.Evaluator.dll
    environment:
      ConnectionStrings__LamortDb: Host=postgres;Port=5432;Database=lamort;Username=lamort_app;Password=CZVbAgw2lPF0RaT0sKI5NlkzL5oyB1i6
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: lamort_mq
      RabbitMq__Password: 2EholF0mxZyz1swHEO0PtoU_qO76x1Gk
      RabbitMq__ExchangeName: lamort.events
      RabbitMq__QueueName: lamort.evaluator.mortgages
      RabbitMq__RoutingKey: mortgage.ready_for_review
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      lamort-migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
  web-data-protection:
